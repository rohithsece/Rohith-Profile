name: generate profile

on:
  workflow_dispatch:
  schedule:
    # Run once per day at a non-:00 minute to avoid fleetwide spikes.
    - cron: "37 5 * * *"
  push:
    paths:
      - "data/profile.yaml"
      - "scripts/**"
      - "templates/**"
      - "assets/**"
      - ".github/workflows/generate-profile.yml"

permissions:
  contents: write

concurrency:
  group: generate-profile
  cancel-in-progress: false

jobs:
  build:
    name: regenerate profile assets
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: generate profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_readme.py

      - name: detect changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: commit & push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(profile): regenerate README and assets"
          git push
