ascii:
  image: assets/profile.jpg
  output: generated/ascii.svg
  # Brightness ramp from darkest -> lightest. Tuned for photographic faces
  # in a dark theme. Characters must be XML-safe.
  ramp: "@%#*+=-:. "
  # Target width of the ASCII portrait in characters. Height is computed
  # from the cropped aspect ratio using a monospace aspect compensation.
  width: 110
  # Vertical scale compensation. A typical monospace cell is roughly twice
  # as tall as it is wide; this factor compensates so the portrait doesn't
  # look stretched.
  vertical_compensation: 0.5
  # Optional manual crop in pixels: (left, top, right, bottom). Set to null
  # to use a centered auto crop. The supplied photo is 472x490, fairly
  # tight to face+shoulders, so a slight crop is fine.
  crop:
    left: 30
    top: 10
    right: 30
    bottom: 0
  # Invert the brightness mapping (useful for dark theme with light text).
  invert: false
  # Contrast boost applied before mapping. 1.0 = no change.
  contrast: 1.25

